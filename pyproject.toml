[build-system]
requires = ["scikit-build-core[pyproject]>=1.0", "pybind11>=2.12", "cmake>=3.20", "auditwheel>=5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "winnex-madhava"
# A versão vem da tag git (setuptools-scm), não de um literal. O literal
# ficou em 1.9.17 enquanto a tag era v1.9.18, e o publish falhou com
# "400 File already exists" porque o wheel subia com a versão antiga.
# winnex-nano e winnex-xfactor já usam este esquema.
dynamic = ["version"]
description = "Deterministic vector search with Cauchy-Schwarz bound pruning + exact-L2 post-filter (BIGANN L2 verified) — provable completeness for RAG indexing and regulated retrieval."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Winnex Brasil Soluções Empresariais LTDA-ME", email = "pay@winnex.ai" },
]
keywords = [
    "vector-search", "cauchy-schwarz", "deterministic", "l2", "bigann",
    "rag", "rag-indexing", "embedding", "approximate-nearest-neighbor",
    "ann", "hnsw", "ivf", "nn-search", "bound", "semantic-search",
    "similarity-search", "retrieval", "exact-search", "nearest-neighbors",
]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
hybrid = ["scikit-learn>=1.0"]
speed = ["torch>=2.0"]

[project.urls]
Homepage = "https://winnex.ai"
Source = "https://github.com/winnex-ai"
Kaggle = "https://www.kaggle.com/code/kleniopadilha/winnex-madhava-pip-200-queries"
Benchmark = "https://www.kaggle.com/code/kleniopadilha/winnex-madhava-pip-200-queries"

[tool.scikit-build]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20"
wheel.packages = ["python/winnex_madhava"]
sdist.include = [
    "include/**",
    "src/**",
    "bindings/**",
    "vendor/**",
    "CMakeLists.txt",
    "pyproject.toml",
    "README.md",
    "LICENSE",
]

[tool.scikit-build.cmake.define]
MADHAVA_BUILD_TESTS = "OFF"
MADHAVA_BUILD_BENCHMARK = "OFF"
MADHAVA_BUILD_EXAMPLES = "OFF"
MADHAVA_BUILD_PYTHON = "ON"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.setuptools]
package-dir = { "" = "python" }

[tool.cibuildwheel]
# Alvos explícitos cp310-cp313 (padrão de winnex-nano e winnex-xfactor).
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import winnex_madhava; print(winnex_madhava.__version__)\""
test-requires = ["numpy"]
build-verbosity = 1

[tool.cibuildwheel.linux]
# A imagem padrão do cibuildwheel (manylinux2014 com um tag fixo) deixou de
# existir no registry:
#   Error response from daemon: No such image:
#   quay.io/pypa/manylinux2014_x86_64:2025.04.19-1
# Isso derrubou o publish da 1.9.18. manylinux_2_28 existe e traz GCC >= 12.
manylinux-x86_64-image = "manylinux_2_28"
# Só x86_64: 4 ABIs x 2 arquiteturas estoura o tempo do job.
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
