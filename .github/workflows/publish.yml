name: publish

# Publish winnex-madhava to PyPI using a Trusted Publisher (OpenID Connect).
# This is the credential-free mechanism recommended by PyPI — no API token
# needed. The PyPI-side configuration must match EXACTLY:
#
#   PyPI Project Name : winnex-madhava
#   Owner             : winnex-ai
#   Repository name   : winnex-madhava
#   Workflow name     : publish.yml
#   Environment name  : publish
#
# The wheel is built with cibuildwheel (manylinux) for CPython 3.10, 3.11 and
# 3.12, plus an sdist — so `pip install` works on the common runtimes without
# compiling from source.

on:
  push:
    tags:
      - "v*"          # v1.0.0, v1.0.1, ... trigger a release
  workflow_dispatch:  # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:
  build-wheels:
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            abi: cp310
          - python-version: '3.11'
            abi: cp311
          - python-version: '3.12'
            abi: cp312
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel for ${{ matrix.abi }}
        uses: pypa/cibuildwheel@v2.17
        with:
          output-dir: wheelhouse
        env:
          CIBW_BUILD: ${{ matrix.abi }}-manylinux_x86_64

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.abi }}
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
